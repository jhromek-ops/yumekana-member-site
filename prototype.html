/* format any embedded ISO date (YYYY-MM-DD) to Japanese YYYY年M月D日; leaves other text untouched */
function jd(s){ if(s==null) return s; return String(s).replace(/(\d{4})-(\d{2})-(\d{2})/g, function(_,y,m,d){ return y+'年'+parseInt(m,10)+'月'+parseInt(d,10)+'日'; }); }
function countryMeta(code){ return DATA.countries.filter(function(c){return c.code===code;})[0] || {code:code,label:code,city:''}; }
function effectiveCountry(){ if(state.country!=='undecided') return state.country; return state.undecidedPreview==='UK'?'UK':'CA'; }
function visaStatus(code){ return DATA.lotteryCountries.indexOf(code)!==-1 ? 'lottery' : DATA.commonVisa.status; }
function docState(doc){ return state.docOverride[doc.id] || DOC_PATTERNS[state.docPattern] || doc.state; }

function fieldRow(r){
  var warn = r.tag==='warning';
  var showField = state.showFields && !!r.field;
  var h = '<div style="display:flex;flex-direction:column;gap:3px;border-top:1px solid #F3F6F7;padding-top:11px;">';
  h += '<span style="font-size:11.5px;color:#7B8694;">'+esc(r.label)+'</span>';
  h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-variant-numeric:tabular-nums;font-size:14px;">'+esc(jd(r.value))+'</span>';
  if(warn) h += '<span style="font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:#FDF3E7;color:#C2761F;">要対応</span>';
  h += '</div>';
  if(showField) h += '<code style="font-variant-numeric:tabular-nums;font-size:10.5px;color:#9AA6B2;background:#F3F6F7;padding:1px 6px;border-radius:3px;align-self:flex-start;">'+esc(r.field)+'</code>';
  h += '</div>';
  return h;
}
function plainRow(r){
  var showField = state.showFields && !!r.field;
  var h = '<div style="display:flex;flex-direction:column;gap:2px;border-top:1px solid #F3F6F7;padding-top:10px;">';
  h += '<span style="font-size:11.5px;color:#7B8694;">'+esc(r.label)+'</span>';
  h += '<span style="font-variant-numeric:tabular-nums;font-size:14px;">'+esc(jd(r.value))+'</span>';
  if(showField) h += '<code style="font-variant-numeric:tabular-nums;font-size:10.5px;color:#9AA6B2;background:#F3F6F7;padding:1px 6px;border-radius:3px;align-self:flex-start;">'+esc(r.field)+'</code>';
  h += '</div>';
  return h;
}

function computeTodos(){
  return DATA.todos.map(function(t){
    var done = !!state.todoDone[t.id];
    var key = done ? 'done' : (t.state==='overdue' ? 'overdue' : 'todo');
    var p = PALETTE[key];
    return { id:t.id, label:t.label, deadlineLabel:(t.deadline.indexOf('-')===-1?t.deadline:'期限 '+jd(t.deadline)), done:done, state:key, stateLabel:p.label, bg:p.bg, fg:p.fg,
      labelColor: done?'#7B8694':'#2A3340', labelDecoration: done?'line-through':'none' };
  });
}

function renderVisa(){
  var d = DATA;
  var code = effectiveCountry();
  var selMeta = countryMeta(state.country);
  var noSupport = d.noVisaSupport.indexOf(state.country)!==-1;
  var isSelf = state.visaHandling==='self';
  var isUndecided = state.country==='undecided';
  var extra = d.countryExtra[code] || {note:'',fields:[]};
  var status = visaStatus(code);
  var stMap = { pending:{label:'審査待ち',bg:'#FDF3E7',fg:'#C2761F'}, lottery:{label:'当選待ち',bg:'#E7E9EE',fg:'#1F2A44'}, issued:{label:'発行済み',bg:'#EAFAF0',fg:'#1F8B4C'} };

  var handlingLabel = noSupport ? 'サポート対象外' : (isSelf ? 'ご自身で申請' : 'ビザ代行');

  var h = '<div class="appcontent">';
  h += '<div class="span2" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><span style="font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:#E7E9EE;color:#1F2A44;">'+esc(selMeta.label)+'</span><span style="font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:#F3F6F7;color:#7B8694;">'+esc(handlingLabel)+'</span></div>';

  if(isUndecided){
    h += '<div class="span2" style="background:#E7E9EE;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;"><p style="margin:0;font-size:12.5px;">渡航先が未定のため、参考として表示パターンをプレビューしています。</p><div style="display:flex;gap:8px;">';

    h += '</div></div>';

  var visaEmpty = noSupport || isSelf;
  if(visaEmpty){
    var emptyText = noSupport ? selMeta.label+'は現在ビザサポートの対象外です。学校・滞在先情報は引き続きご確認いただけます。' : 'ビザ申請はお客様ご自身で行われています。進捗の管理・お問い合わせはお客様にてお願いいたします。必要書類の一覧は参考としてご確認ください。';
    h += '<div class="span2" style="display:flex;gap:12px;align-items:flex-start;background:#F3F6F7;border-radius:8px;padding:18px;"><span style="font-size:20px;color:#39B3A6;line-height:1;">—</span><p style="margin:0;font-size:13px;color:#7B8694;">'+esc(emptyText)+'</p></div>';
  } else {

  frame.className = 'm-'+mode;
  frame.style.maxWidth = (MODES[mode]||MODES.mobile).width;

  var titles = { home:{en:'My page',ja:'マイページ'}, todo:{en:'Countdown',ja:'渡航までのToDo'}, visa:{en:'Visa',ja:'ビザ情報'}, school:{en:'School & Accommodation',ja:'学校・滞在先情報'}, booking:{en:'Counseling',ja:'面談を予約する'}, notices:{en:'Notices',ja:'お知らせ'}, notice:{en:'Notice',ja:'お知らせ詳細'}, spec:{en:'For developers',ja:'API／フィールド仕様'} };
  var t = titles[state.screen] || titles.home;
  var nav = navList();
  var h = '';

  if(mode==='desktop'){
    h += '<div style="display:flex;min-height:100vh;align-items:stretch;">';
    /* sidebar */
    h += '<aside style="width:224px;flex:none;border-right:1px solid #E7EBEF;background:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:3px;">';
    h += '<div style="display:flex;align-items:center;gap:10px;padding:4px 8px 18px;"><img src="logo.webp" alt="夢カナ留学" style="height:24px;width:auto;display:block;" /></div>';
    h += nav.map(function(n){var on=state.screen===n.key;return '<button class="ms-side-nav" data-act="nav" data-screen="'+n.key+'" style="display:flex;align-items:center;gap:11px;text-align:left;border:none;background:'+(on?'#E7F5F3':'transparent')+';color:'+(on?'#1F7A72':'#5B6672')+';font-size:14px;font-weight:'+(on?700:600)+';padding:12px 12px;border-radius:8px;cursor:pointer;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="'+(on?'#1F7A72':'#9AA6B2')+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+NAV_ICONS[n.key]+'"></path></svg>'+esc(n.label)+'</button>';}).join('');
    h += '<div style="flex:1;"></div>';
    h += '<button data-act="toggleDev" style="border:1px dashed #C9D2D9;background:#F3F6F7;color:#7B8694;font-size:11px;font-weight:700;letter-spacing:.06em;padding:10px 12px;border-radius:8px;cursor:pointer;">DEV パネル</button>';
    h += '</aside>';
    /* main */
    h += '<div style="flex:1;min-width:0;display:flex;flex-direction:column;">';
    h += '<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #E7EBEF;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;"><div style="display:flex;flex-direction:column;gap:2px;"><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7B8694;">'+esc(t.en)+'</div><h1 style="margin:0;font-size:21px;font-weight:700;">'+esc(t.ja)+'</h1></div><div style="text-align:right;font-size:12px;color:#7B8694;line-height:1.5;">'+esc(DATA.member.name)+' さま<br><span style="font-variant-numeric:tabular-nums;">ID '+esc(DATA.member.memberId)+'</span></div></header>';
    h += screenContent();
    h += '</div></div>';
    if(state.devOpen) h += renderDev();
  } else {
    var navW = (MODES[mode]||MODES.mobile).width;
    h += '<div style="display:flex;flex-direction:column;padding-bottom:88px;">';
    h += '<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #E7EBEF;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;"><div style="display:flex;align-items:center;gap:10px;"><img src="logo.webp" alt="夢カナ留学" style="height:22px;width:auto;display:block;" /><span style="font-size:11px;letter-spacing:.1em;color:#7B8694;border-left:1px solid #E7EBEF;padding-left:10px;">会員サイト</span></div><button data-act="toggleDev" style="border:1px dashed #C9D2D9;background:#F3F6F7;color:#7B8694;font-size:11px;font-weight:700;letter-spacing:.06em;padding:7px 11px;border-radius:100px;cursor:pointer;">DEV</button></header>';
    h += '<div style="padding:20px 18px 8px;display:flex;flex-direction:column;gap:6px;"><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7B8694;">'+esc(t.en)+'</div><h1 style="margin:0;font-size:21px;font-weight:700;">'+esc(t.ja)+'</h1></div>';
    h += screenContent();
    if(state.devOpen) h += renderDev();
    h += '<nav style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:'+navW+';background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid #E7EBEF;display:grid;grid-template-columns:repeat('+nav.length+',1fr);z-index:30;">';
    h += nav.map(function(n){var on=state.screen===n.key;return '<button data-act="nav" data-screen="'+n.key+'" style="border:none;background:none;cursor:pointer;padding:11px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;"><span style="width:100%;height:2px;border-radius:100px;background:'+(on?'#39B3A6':'transparent')+';"></span><span style="font-size:11.5px;font-weight:'+(on?700:500)+';color:'+(on?'#2A3340':'#9AA6B2')+';">'+esc(n.label)+'</span></button>';}).join('');
    h += '</nav>';
    h += '</div>';
  }
  frame.innerHTML = h;
}

/* ---------------- events ---------------- */
document.getElementById('frame').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el) return;
  var a = el.getAttribute('data-act');
  switch(a){
    case 'login': state.screen='home'; state.loginError=false; state.devOpen=false; break;
    case 'toggleLoginError': state.loginError=!state.loginError; break;
    case 'toggleDev': state.devOpen=!state.devOpen; break;
    case 'devBackdrop': if(e.target===el){ state.devOpen=false; } else { return; } break;
    case 'nav': state.screen=el.getAttribute('data-screen'); state.noticeId=null; break;
    case 'go':
      var scr=el.getAttribute('data-screen');
      state.screen=scr; state.devOpen=false;
      if(scr==='booking') state.bookingStep=1;
      if(scr==='notices') state.noticeId=null;
      break;
    case 'toggleTodo': var id=el.getAttribute('data-id'); state.todoDone[id]=!state.todoDone[id]; break;
    case 'openNotice': state.screen='notice'; state.noticeId=el.getAttribute('data-id'); break;
    case 'uploadDoc': state.docOverride[el.getAttribute('data-id')]='reviewing'; break;
    case 'preview': state.undecidedPreview=el.getAttribute('data-val'); break;
    case 'selectSlot': state.slotId=el.getAttribute('data-id'); break;
    case 'step': state.bookingStep=Number(el.getAttribute('data-step')); break;
    case 'setCountry': state.country=el.getAttribute('data-code'); break;
    case 'opt': state[el.getAttribute('data-key')]=el.getAttribute('data-value'); break;
    case 'toggleFields': state.showFields=!state.showFields; break;
    case 'logout': state.screen='login'; state.devOpen=false; break;
    default: return;
  }
  render();
});

render();
</script>
