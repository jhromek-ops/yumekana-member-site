/* ---- inline SVG flags (emoji flags don't render on Windows) ---- */
function starPath(cx,cy,r,rot){
  rot = (rot==null?-90:rot); var p=[];
  for(var i=0;i<5;i++){
    var ao=(rot+i*72)*Math.PI/180, ai=(rot+36+i*72)*Math.PI/180;
    p.push((cx+r*Math.cos(ao)).toFixed(2)+' '+(cy+r*Math.sin(ao)).toFixed(2));
    p.push((cx+r*0.42*Math.cos(ai)).toFixed(2)+' '+(cy+r*0.42*Math.sin(ai)).toFixed(2));
  }
  return 'M'+p.join('L')+'Z';
}
function starsSVG(list,fill,stroke){
  return list.map(function(s){ return '<path d="'+starPath(s[0],s[1],s[2],s[3])+'" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="0.5"':'')+'/>'; }).join('');
}
function unionJack(w,h,s){
  return '<rect width="'+w+'" height="'+h+'" fill="#012169"/>'
    +'<path d="M0 0L'+w+' '+h+'M'+w+' 0L0 '+h+'" stroke="#fff" stroke-width="'+(8*s)+'"/>'
    +'<path d="M0 0L'+w+' '+h+'M'+w+' 0L0 '+h+'" stroke="#C8102E" stroke-width="'+(3.2*s)+'"/>'
    +'<path d="M'+(w/2)+' 0V'+h+'M0 '+(h/2)+'H'+w+'" stroke="#fff" stroke-width="'+(11*s)+'"/>'
    +'<path d="M'+(w/2)+' 0V'+h+'M0 '+(h/2)+'H'+w+'" stroke="#C8102E" stroke-width="'+(6.5*s)+'"/>';
}
function ozFlag(nz){
  var cid='oz'+(nz?'nz':'au');
  var h='<rect width="60" height="40" fill="#00247D"/>';
  h+='<defs><clipPath id="'+cid+'"><rect width="30" height="20"/></clipPath></defs>';
  h+='<g clip-path="url(#'+cid+')">'+unionJack(30,20,0.5)+'</g>';
  if(nz){ h+=starsSVG([[46,10,2.6,-90],[52,20,2.2,-90],[46,31,2.6,-90],[40,22,2.2,-90]],'#CC142B','#fff'); }
  else {
    h+=starsSVG([[15,30,4,-90]],'#fff');
    h+=starsSVG([[47,10,2.5,-90],[54,20,1.5,-90],[47,31,2.5,-90],[40,22,2.3,-90],[48,20,2.2,-90]],'#fff');
  }
  return h;
}
function usFlag(){
  var sh=40/13, h='';
  for(var i=0;i<13;i++){ h+='<rect y="'+(i*sh).toFixed(2)+'" width="60" height="'+sh.toFixed(2)+'" fill="'+(i%2===0?'#B22234':'#fff')+'"/>'; }
  var ch=7*sh; h+='<rect width="24" height="'+ch.toFixed(2)+'" fill="#3C3B6E"/>';
  var sl=[]; for(var r=0;r<5;r++){ for(var c=0;c<6;c++){ if((r+c)%2===0) sl.push([2.4+c*3.6, 2.1+r*(ch-4.2)/4, 1.05, -90]); } }
  return h+starsSVG(sl,'#fff');
}
function phFlag(){
  var h='<rect width="60" height="20" fill="#0038A8"/><rect y="20" width="60" height="20" fill="#CE1126"/>';
  h+='<path d="M0 0L26 20L0 40Z" fill="#fff"/>';
  h+='<circle cx="9" cy="20" r="3.1" fill="#FCD116"/>';
  for(var k=0;k<8;k++){ var a=k*45*Math.PI/180; h+='<line x1="'+(9+3.5*Math.cos(a)).toFixed(2)+'" y1="'+(20+3.5*Math.sin(a)).toFixed(2)+'" x2="'+(9+5*Math.cos(a)).toFixed(2)+'" y2="'+(20+5*Math.sin(a)).toFixed(2)+'" stroke="#FCD116" stroke-width="1"/>'; }
  return h+starsSVG([[3.6,3.6,1.4,-90],[3.6,36.4,1.4,-90],[22,20,1.4,-90]],'#FCD116');
}
function FLAG_ART(code){
  switch(code){
    case 'UK': return unionJack(60,40,1);
    case 'IE': return '<rect width="20" height="40" fill="#169B62"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#FF883E"/>';
    case 'CA': return '<rect width="60" height="40" fill="#fff"/><rect width="15" height="40" fill="#D80621"/><rect x="45" width="15" height="40" fill="#D80621"/><path d="M30 9L31.2 13L35 12.2L34 15.5L38 16L35.5 18.5L40 21L31.5 20.5L32 31L30 29.5L28 31L28.5 20.5L20 21L24.5 18.5L22 16L26 15.5L25 12.2L28.8 13Z" fill="#D80621"/>';
    case 'AU': return ozFlag(false);
    case 'NZ': return ozFlag(true);
    case 'US': return usFlag();

  }
}

function jd(s){ if(s==null) return s; return String(s).replace(/(\d{4})-(\d{2})-(\d{2})/g, function(_,y,m,d){ return y+'年'+parseInt(m,10)+'月'+parseInt(d,10)+'日'; }); }

function jdWd(s){ var m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/); if(!m) return jd(s); var dt=new Date(+m[1], +m[2]-1, +m[3]); var wd=['日','月','火','水','木','金','土'][dt.getDay()]; return parseInt(m[2],10)+'月'+parseInt(m[3],10)+'日（'+wd+'）'; }

  h += '<div style="display:flex;flex-direction:column;gap:7px;"><span style="font-size:11.5px;font-weight:700;">夢カナEnglish 契約 — member.ye.has</span><div style="display:flex;gap:6px;">'+optBtns('yeContract',[{label:'あり',value:'yes'},{label:'なし',value:'no'}])+'</div><span style="font-size:11px;color:#7B8694;">「あり」のとき、契約情報に受講期間・メニューに夢カナEnglishを表示します。</span></div>';

  h += '<div style="display:flex;flex-direction:column;gap:7px;"><span style="font-size:11.5px;font-weight:700;">滞在先タイプ — member.stayType</span><div style="display:flex;gap:6px;">'+optBtns('stayType',[{label:'ホームステイ',value:'homestay'},{label:'寮',value:'dorm'},{label:'自己手配',value:'self'}])+'</div></div>';
  h += '<div style="display:flex;flex-direction:column;gap:7px;"><span style="font-size:11.5px;font-weight:700;">書類の状態パターン — document[].state</span><div style="display:flex;gap:6px;">'+optBtns('docPattern',[{label:'混在',value:'mixed'},{label:'全て未提出',value:'allTodo'},{label:'全て受領',value:'allApproved'}])+'</div></div>';
  h += '<div style="display:flex;flex-direction:column;gap:8px;border-top:1px dashed #C9D2D9;padding-top:14px;"><button data-act="toggleFields" style="border:1px solid #39B3A6;background:'+(state.showFields?'#39B3A6':'#FFFFFF')+';color:'+(state.showFields?'#FFFFFF':'#2F9E93')+';font-size:12.5px;font-weight:700;padding:12px;border-radius:5px;cursor:pointer;min-height:44px;">フィールド名の表示：'+(state.showFields?'ON':'OFF')+'</button><button data-act="go" data-screen="spec" style="border:1px solid #C9D2D9;background:#fff;color:#2A3340;font-size:12.5px;font-weight:700;padding:12px;border-radius:5px;cursor:pointer;min-height:44px;">API／フィールド仕様書を開く</button><button data-act="logout" style="border:1px solid #C9D2D9;background:#fff;color:#7B8694;font-size:12.5px;font-weight:700;padding:12px;border-radius:5px;cursor:pointer;min-height:44px;">ログイン画面に戻る</button></div>';

/* target: 'side' (desktop sidebar) or 'bottom' (mobile/tablet bottom nav).
   イベント appears in the sidebar only; 夢カナEnglish appears everywhere when contracted. */
function navList(target){
  var items = [
    {key:'home',label:'ホーム'},
    {key:'todo',label:'ToDo'},
    {key:'visa',label:'ビザ'},
    {key:'school',label:'学校', when:function(){return state.arrangement==='yes';}},
    {key:'events',label:'イベント', when:function(){return target==='side';}},
    {key:'ye',label:'夢カナEnglish', short:'English', when:function(){return hasYE();}},
    {key:'notices',label:'お知らせ', when:function(){return target==='side';}}
  ];
  return items.filter(function(n){ return !n.when || n.when(); });
}
function screenContent(){
  var s = state.screen;
  if(s==='home') return renderHome();
  if(s==='todo') return renderTodo();
  if(s==='visa') return renderVisa();
  if(s==='school') return renderSchool();
  if(s==='booking') return renderBooking();
  if(s==='events') return renderEvents();
  if(s==='ye') return renderYe();
  if(s==='notices') return renderNotices();
  if(s==='notice') return renderNotice();
  if(s==='spec') return renderSpec();
  return '';
}

function renderChatbot(){
  if(state.devOpen) return '';
  var off = (state.viewMode==='desktop') ? '24px' : '100px'; /* clear the bottom nav on mobile/tablet */
  var h = '';
  if(state.chatOpen){
    h += '<div style="position:fixed;right:20px;bottom:calc('+off+' + 66px);width:300px;max-width:calc(100vw - 40px);background:#fff;border:1px solid #E7EBEF;border-radius:14px;box-shadow:0 14px 34px rgba(31,42,68,.20);z-index:46;overflow:hidden;">';
    h += '<div style="background:#1F2A44;color:#fff;padding:13px 15px;display:flex;align-items:center;gap:10px;"><span style="flex-shrink:0;width:30px;height:30px;border-radius:100px;background:#39B3A6;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+ICON_CHAT+'"></path></svg></span><div style="display:flex;flex-direction:column;line-height:1.3;"><span style="font-size:13.5px;font-weight:700;">夢カナ サポートbot</span><span style="font-size:10.5px;opacity:.8;">ご質問にお答えします</span></div></div>';
    h += '<div style="padding:15px;display:flex;flex-direction:column;gap:10px;"><div style="align-self:flex-start;background:#F3F6F7;border-radius:12px 12px 12px 3px;padding:10px 13px;font-size:12.5px;color:#2A3340;max-width:88%;line-height:1.6;">こんにちは！ビザ・お手続き・夢カナEnglish など、気になることをお気軽にご質問ください。</div><div style="font-size:10.5px;color:#9AA6B2;text-align:center;">※ プロトタイプのため、応答はまだ動作しません。</div></div>';
    h += '</div>';
  }
  h += '<button data-act="toggleChat" aria-label="チャットサポート" style="position:fixed;right:20px;bottom:'+off+';width:56px;height:56px;border-radius:100px;border:none;background:#39B3A6;box-shadow:0 8px 20px rgba(57,179,166,.45);cursor:pointer;z-index:46;display:flex;align-items:center;justify-content:center;padding:0;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+(state.chatOpen?'M6 6l12 12M18 6L6 18':ICON_CHAT)+'"></path></svg></button>';
  return h;
}
function render(){
  var frame = document.getElementById('frame');
  var mode = state.viewMode || 'mobile';
  if(state.screen==='login'){ frame.className='m-'+mode; frame.style.maxWidth='480px'; frame.innerHTML = renderLogin(); return; }

  frame.className = 'm-'+mode;
  frame.style.maxWidth = (MODES[mode]||MODES.mobile).width;

  var titles = { home:{en:'My page',ja:'マイページ'}, todo:{en:'Countdown',ja:'渡航までのToDo'}, visa:{en:'Visa',ja:'ビザ情報'}, school:{en:'School & Accommodation',ja:'学校・滞在先情報'}, booking:{en:'Counseling',ja:'面談を予約する'}, events:{en:'Events',ja:'イベント'}, ye:{en:'Yumekana English',ja:'夢カナEnglish'}, notices:{en:'Notices',ja:'お知らせ'}, notice:{en:'Notice',ja:'お知らせ詳細'}, spec:{en:'For developers',ja:'API／フィールド仕様'} };
  var t = titles[state.screen] || titles.home;
  var h = '';

  if(mode==='desktop'){
    var nav = navList('side');
    h += '<div style="display:flex;min-height:100vh;align-items:stretch;">';
    /* sidebar */
    h += '<aside style="width:224px;flex:none;border-right:1px solid #E7EBEF;background:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:3px;">';
    h += '<div style="display:flex;align-items:center;gap:10px;padding:4px 8px 18px;"><img src="logo.webp" alt="夢カナ留学" style="height:24px;width:auto;display:block;" /></div>';
    h += nav.map(function(n){var on=state.screen===n.key;var bd=navBadge(n.key);var badge=bd>0?'<span style="margin-left:auto;flex-shrink:0;min-width:20px;height:20px;padding:0 6px;border-radius:100px;background:#E0453A;color:#fff;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;">'+bd+'</span>':'';return '<button class="ms-side-nav" data-act="nav" data-screen="'+n.key+'" style="display:flex;align-items:center;gap:11px;text-align:left;border:none;background:'+(on?'#E7F5F3':'transparent')+';color:'+(on?'#1F7A72':'#5B6672')+';font-size:14px;font-weight:'+(on?700:600)+';padding:12px 12px;border-radius:8px;cursor:pointer;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="'+(on?'#1F7A72':'#9AA6B2')+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+NAV_ICONS[n.key]+'"></path></svg><span>'+esc(n.label)+'</span>'+badge+'</button>';}).join('');
    h += '<div style="flex:1;"></div>';
    h += '<button data-act="toggleDev" style="border:1px dashed #C9D2D9;background:#F3F6F7;color:#7B8694;font-size:11px;font-weight:700;letter-spacing:.06em;padding:10px 12px;border-radius:8px;cursor:pointer;">DEV パネル</button>';
    h += '</aside>';
    /* main */
    h += '<div style="flex:1;min-width:0;display:flex;flex-direction:column;">';
    h += '<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #E7EBEF;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;"><div style="display:flex;flex-direction:column;gap:2px;"><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7B8694;">'+esc(t.en)+'</div><h1 style="margin:0;font-size:21px;font-weight:700;">'+esc(t.ja)+'</h1></div><div style="text-align:right;font-size:12px;color:#7B8694;line-height:1.5;">'+esc(DATA.member.name)+' さま<br><span style="font-variant-numeric:tabular-nums;">ID '+esc(DATA.member.memberId)+'</span></div></header>';
    h += screenContent();
    h += '</div></div>';
    if(state.devOpen) h += renderDev();
  } else {
    var nav = navList('bottom');
    var navW = (MODES[mode]||MODES.mobile).width;
    h += '<div style="display:flex;flex-direction:column;padding-bottom:88px;">';
    h += '<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #E7EBEF;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;"><div style="display:flex;align-items:center;gap:10px;"><img src="logo.webp" alt="夢カナ留学" style="height:22px;width:auto;display:block;" /><span style="font-size:11px;letter-spacing:.1em;color:#7B8694;border-left:1px solid #E7EBEF;padding-left:10px;">会員サイト</span></div><div style="display:flex;align-items:center;gap:9px;"><button data-act="nav" data-screen="notices" aria-label="お知らせ" style="position:relative;border:1px solid #E7EBEF;background:#fff;border-radius:100px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="'+(state.screen==='notices'?'#1F7A72':'#5B6672')+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+ICON_BELL+'"></path></svg>'+(unreadNotices()>0?'<span style="position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:100px;background:#E0453A;color:#fff;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;">'+unreadNotices()+'</span>':'')+'</button><button data-act="toggleDev" style="border:1px dashed #C9D2D9;background:#F3F6F7;color:#7B8694;font-size:11px;font-weight:700;letter-spacing:.06em;padding:7px 11px;border-radius:100px;cursor:pointer;">DEV</button></div></header>';
    h += '<div style="padding:20px 18px 8px;display:flex;flex-direction:column;gap:6px;"><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7B8694;">'+esc(t.en)+'</div><h1 style="margin:0;font-size:21px;font-weight:700;">'+esc(t.ja)+'</h1></div>';
    h += screenContent();
    if(state.devOpen) h += renderDev();
    h += '<nav style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:'+navW+';background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid #E7EBEF;display:grid;grid-template-columns:repeat('+nav.length+',1fr);z-index:30;">';
    h += nav.map(function(n){var on=state.screen===n.key;var col=on?'#1F7A72':'#9AA6B2';return '<button data-act="nav" data-screen="'+n.key+'" style="border:none;background:none;cursor:pointer;padding:9px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+NAV_ICONS[n.key]+'"></path></svg><span style="font-size:11px;font-weight:'+(on?700:500)+';color:'+(on?'#2A3340':'#9AA6B2')+';white-space:nowrap;">'+esc(n.short||n.label)+'</span></button>';}).join('');
    h += '</nav>';
    h += '</div>';
  }
  h += renderChatbot();
  frame.innerHTML = h;
}

/* ---------------- events ---------------- */
document.getElementById('frame').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el) return;
  var a = el.getAttribute('data-act');
  switch(a){
    case 'login': state.screen='home'; state.loginError=false; state.devOpen=false; break;
    case 'toggleLoginError': state.loginError=!state.loginError; break;
    case 'toggleDev': state.devOpen=!state.devOpen; break;
    case 'toggleChat': state.chatOpen=!state.chatOpen; break;
    case 'devBackdrop': if(e.target===el){ state.devOpen=false; } else { return; } break;
    case 'nav': state.screen=el.getAttribute('data-screen'); state.noticeId=null; break;
    case 'go':
      var scr=el.getAttribute('data-screen');
      state.screen=scr; state.devOpen=false;
      if(scr==='booking') state.bookingStep=1;
      if(scr==='notices') state.noticeId=null;
      break;
    case 'toggleTodo': var id=el.getAttribute('data-id'); state.todoDone[id]=!state.todoDone[id]; break;
    case 'openNotice': state.screen='notice'; state.noticeId=el.getAttribute('data-id'); break;
    case 'uploadDoc': state.docOverride[el.getAttribute('data-id')]='reviewing'; break;
    case 'preview': state.undecidedPreview=el.getAttribute('data-val'); break;
    case 'selectSlot': state.slotId=el.getAttribute('data-id'); break;
    case 'step': state.bookingStep=Number(el.getAttribute('data-step')); break;
    case 'setCountry': state.country=el.getAttribute('data-code'); break;
    case 'opt': state[el.getAttribute('data-key')]=el.getAttribute('data-value'); break;
    case 'toggleOri': state.oriDone=!state.oriDone; break;
    case 'toggleFields': state.showFields=!state.showFields; break;
    case 'logout': state.screen='login'; state.devOpen=false; break;
    default: return;
  }
  render();
});

render();
</script>
