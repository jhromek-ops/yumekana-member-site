/* ---- inline SVG flags (emoji flags don't render on Windows) ---- */
function starPath(cx,cy,r,rot){
  rot = (rot==null?-90:rot); var p=[];
  for(var i=0;i<5;i++){
    var ao=(rot+i*72)*Math.PI/180, ai=(rot+36+i*72)*Math.PI/180;
    p.push((cx+r*Math.cos(ao)).toFixed(2)+' '+(cy+r*Math.sin(ao)).toFixed(2));
    p.push((cx+r*0.42*Math.cos(ai)).toFixed(2)+' '+(cy+r*0.42*Math.sin(ai)).toFixed(2));
  }
  return 'M'+p.join('L')+'Z';
}
function starsSVG(list,fill,stroke){
  return list.map(function(s){ return '<path d="'+starPath(s[0],s[1],s[2],s[3])+'" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="0.5"':'')+'/>'; }).join('');
}
function unionJack(w,h,s){
  return '<rect width="'+w+'" height="'+h+'" fill="#012169"/>'
    +'<path d="M0 0L'+w+' '+h+'M'+w+' 0L0 '+h+'" stroke="#fff" stroke-width="'+(8*s)+'"/>'
    +'<path d="M0 0L'+w+' '+h+'M'+w+' 0L0 '+h+'" stroke="#C8102E" stroke-width="'+(3.2*s)+'"/>'
    +'<path d="M'+(w/2)+' 0V'+h+'M0 '+(h/2)+'H'+w+'" stroke="#fff" stroke-width="'+(11*s)+'"/>'
    +'<path d="M'+(w/2)+' 0V'+h+'M0 '+(h/2)+'H'+w+'" stroke="#C8102E" stroke-width="'+(6.5*s)+'"/>';
}
function ozFlag(nz){
  var cid='oz'+(nz?'nz':'au');
  var h='<rect width="60" height="40" fill="#00247D"/>';
  h+='<defs><clipPath id="'+cid+'"><rect width="30" height="20"/></clipPath></defs>';
  h+='<g clip-path="url(#'+cid+')">'+unionJack(30,20,0.5)+'</g>';
  if(nz){ h+=starsSVG([[46,10,2.6,-90],[52,20,2.2,-90],[46,31,2.6,-90],[40,22,2.2,-90]],'#CC142B','#fff'); }
  else {
    h+=starsSVG([[15,30,4,-90]],'#fff');
    h+=starsSVG([[47,10,2.5,-90],[54,20,1.5,-90],[47,31,2.5,-90],[40,22,2.3,-90],[48,20,2.2,-90]],'#fff');
  }
  return h;
}
function usFlag(){
  var sh=40/13, h='';
  for(var i=0;i<13;i++){ h+='<rect y="'+(i*sh).toFixed(2)+'" width="60" height="'+sh.toFixed(2)+'" fill="'+(i%2===0?'#B22234':'#fff')+'"/>'; }
  var ch=7*sh; h+='<rect width="24" height="'+ch.toFixed(2)+'" fill="#3C3B6E"/>';
  var sl=[]; for(var r=0;r<5;r++){ for(var c=0;c<6;c++){ if((r+c)%2===0) sl.push([2.4+c*3.6, 2.1+r*(ch-4.2)/4, 1.05, -90]); } }
  return h+starsSVG(sl,'#fff');
}
function phFlag(){
  var h='<rect width="60" height="20" fill="#0038A8"/><rect y="20" width="60" height="20" fill="#CE1126"/>';
  h+='<path d="M0 0L26 20L0 40Z" fill="#fff"/>';
  h+='<circle cx="9" cy="20" r="3.1" fill="#FCD116"/>';
  for(var k=0;k<8;k++){ var a=k*45*Math.PI/180; h+='<line x1="'+(9+3.5*Math.cos(a)).toFixed(2)+'" y1="'+(20+3.5*Math.sin(a)).toFixed(2)+'" x2="'+(9+5*Math.cos(a)).toFixed(2)+'" y2="'+(20+5*Math.sin(a)).toFixed(2)+'" stroke="#FCD116" stroke-width="1"/>'; }
  return h+starsSVG([[3.6,3.6,1.4,-90],[3.6,36.4,1.4,-90],[22,20,1.4,-90]],'#FCD116');
}
function FLAG_ART(code){

/* Zohoの「VISA申請」ステージ名から、お客様向けのステップ番号を引く */
function visaStageStep(stage){

  DATA.visaStageMap.steps.forEach(function(s,i){ if(s.stages.indexOf(stage)!==-1) n = i+1; });
  return n;
}

}

/* 入国期限と渡航予定日を突き合わせる。
   2026年10月19日の朝礼で、国ごとに名称が違っていた日付（イギリスの「ビザ有効期間の最終日」など）を
   すべて「入国期限」に統一したため、判定軸も1本になった。 */
function visaFitCheck(fields){
  var limit = null;
  fields.forEach(function(f){ if(f.entryBy) limit = f.value; });
  if(!limit) return null;
  var title = '入国期限と渡航予定日';
  if(state.visaFit==='unknown') return { kind:'unknown', title:title,
    text:'渡航予定日がまだ登録されていません。登録されると、入国期限に間に合うかを自動で判定します。',
    action:'担当コンサルタントへご予定をお知らせください。' };
  var dep = state.visaFit==='conflict' ? '2027-12-31' : DATA.member.departureDate;
  if(new Date(limit) >= new Date(dep)) return { kind:'ok', title:title,
    text:'ご予定の渡航日（'+jd(dep)+'）は、入国期限（'+jd(limit)+'）に間に合っています。',
    action:'このままご渡航いただけます。' };
  return { kind:'conflict', title:title,
    text:'ご予定の渡航日（'+jd(dep)+'）が、入国期限（'+jd(limit)+'）を過ぎています。この期限までに入国しないとビザが無効になります。',
    action:'渡航日を入国期限より前に変更する必要があります。担当コンサルタントへご相談ください。' };
}

/* ToDoの表示条件。出典：顧客ToDo 見え方ガイド（2026年10月14日時点）
   ・すべてのToDoは 連絡先ステータス＝契約 の方にのみ表示する
   ・ビザ準備のToDo（visaPrep）は、さらに渡航日が12か月以内の方にのみ表示する */
function docStateList(){ return DATA.documents.map(docState); }
/* ビザ申請を外部の事業者へ委託しているお客様（2026年10月23日のミーティング）。
   カナダはEdoca（https://edoca.ca/ja/）が申請を進めるため、会員サイトでは
   パスポートと渡航予定日だけをお見せし、以降の進み具合はEdocaへご案内する。 */
function isOutsourced(){ return state.visaPipeline==='edoca'; }
/* イギリスはパスポートの全ページが必要で、枚数が多くフォームでは扱いきれない。
   2026年10月23日のミーティングで、イギリスに限りGoogle Driveのフォルダで
   お預かりすると決めた。判定は書類種別マスタの Drive_Submission_Countries、
   フォルダのURLはVISA申請の Drive_Submission_Folder_URL から来る
   （docs/zoho-integration/README.md 2-4）。URLはZoho側で自動作成して入る予定で、
   空のあいだは担当者がLINEでフォルダをご案内する。 */
function driveUpload(doc){
  var cs = DATA.driveSubmission.countries[doc.id];
  if(!cs || cs.indexOf(state.country)===-1) return null;
  var d = DATA.driveSubmission;
  return { label:d.label, note:d.note, noFolder:d.noFolder, url: state.driveFolder==='yes' ? d.url : '' };
}
/* ご渡航予定日が確定するのは航空券をお預かりしたあと（ビザ申請より後）のため、
   書類まわりの期限は仮のご渡航予定日から逆算した目安になる。2026年10月23日の
   ミーティングで、Zoho側に「仮目安」の項目を持たせ、目安である旨を明示すると決めた。 */
function isEstimated(){ return state.departureFixed==='tentative'; }
function estTag(){ return isEstimated() ? '（目安）' : ''; }
function hasVisaFlow(){ return state.visaHandling!=='self' && DATA.noVisaSupport.indexOf(state.country)===-1 && !isOutsourced(); }
function todoVisible(t){
  if(state.contractStatus!=='contract') return false;
  if(t.visaPrep && state.within12m!=='yes') return false;
  var ds = docStateList(), hv = hasVisaFlow();
  var some = function(k){ return ds.indexOf(k)!==-1; };
  var issued = visaStageStatus()==='issued';
  var afterVisa = !hv || issued;
  switch(t.when){
    /* AU・NZ・UK・IE のみ（CAは対象外）。ビザステータス＝未申請のときに出す */
    case 'visaForm':    return hv && ['AU','NZ','UK','IE'].indexOf(state.country)!==-1 && visaStageStatus()==='notApplied';
    /* 未提出か要再提出が1つでもあれば出る。「準備中」は数えない */
    case 'docsPending': return (hv || isOutsourced()) && (some('todo')||some('rejected'));
    /* アイルランドはお客様が移民局へ直接お支払いになるため、夢カナへのお支払いは発生しない */
    case 'visaFee':     return hv && state.country!=='IE' && !issued;
    /* ビザセンターが必要なのはイギリスとカナダのみ。イギリスは予約を夢カナが代行し、カナダは予約も訪問もお客様が対応する */
    case 'visaCenterUK': return hv && state.country==='UK' && !issued;
    case 'visaCenterCA': return hv && state.country==='CA' && !issued;
    case 'visaIssued':  return afterVisa;
    /* 学校・滞在先の請求書は同じ日付にまとめるため、お支払いのToDoも1件にする */
    case 'schoolFee':   return state.arrangement==='yes';
    /* eVisaはイギリスのみ。ビザが発給されてからご確認いただく */
    case 'evisaUK':     return state.country==='UK' && visaStageStatus()==='issued';
    /* 連絡先「海外保険加入状況」＝OFF の方にだけ出す */
    case 'insurance':   return afterVisa && true;
    default: return true;
  }
}
function computeTodos(){
  /* 期限の早い順に並べる。日付を持たないものは sortAt を使う */
  /* 「必要書類の提出」は、ご提出が必要な書類ごとの項目に展開する（2026年10月19日のご要望） */
  var base = [];
  DATA.todos.filter(todoVisible).forEach(function(t){
    if(!t.expandDocs){ base.push(t); return; }
    DATA.documents.forEach(function(doc){
      var st = docState(doc);
      if(st!=='todo' && st!=='rejected') return;
      /* 外部委託の場合、会員サイトでお預かりするのはパスポートのみ */
      if(isOutsourced() && doc.id!=='passport') return;
      base.push({ id:'doc-'+doc.id, docId:doc.id, label:doc.name, phase:t.phase, owner:t.owner, visaPrep:t.visaPrep,
        deadline:doc.dueDate||t.deadline, sortAt:doc.dueDate||t.deadline,
        state: st,
        actor:'member', action: st==='rejected' ? '再提出' : '提出',
        target:'docdetail', recommend:t.recommend });
    });
  });
  var list = base.slice().sort(function(a,b){
    var ka=a.sortAt||a.deadline, kb=b.sortAt||b.deadline;
    return ka<kb?-1:(ka>kb?1:0);
  });
  return list.map(function(t){
    var done = !!state.todoDone[t.id];
    var isStaff = t.actor==='staff';
    var overdue = t.state==='overdue';
    var rejected = t.state==='rejected';
    var key, stateLabel, bg, fg, who, whoBg, whoFg;
    if(done){ key='done'; stateLabel='完了'; bg=PALETTE.done.bg; fg=PALETTE.done.fg; who=''; }
    else if(isStaff){ key='staff'; stateLabel='夢カナ確認中'; bg='#EEF0FB'; fg='#4A56B8'; who='夢カナが対応中（お客様の操作は不要です）'; whoBg='#EEF0FB'; whoFg='#4A56B8'; }
    else { key = overdue?'overdue':(rejected?'rejected':'todo'); stateLabel=(t.action||'ご対応')+'が必要'; if(overdue) stateLabel='期限超過・'+stateLabel; bg=(overdue?PALETTE.overdue.bg:(rejected?PALETTE.rejected.bg:PALETTE.todo.bg)); fg=(overdue?PALETTE.overdue.fg:(rejected?PALETTE.rejected.fg:PALETTE.todo.fg)); who='お客様のご対応が必要です'; whoBg='#FDF3E7'; whoFg='#B4522A'; }
    /* 日付の期限だけが逆算の対象。「契約後2週間以内」のような文言には目安を付けない */
    var est = !!t.visaPrep && isEstimated() && t.deadline.indexOf('-')!==-1;
    return { id:t.id, docId:t.docId||'', label:t.label, phase:t.phase||'', owner:t.owner||'', backend:t.backend||'', deadlineLabel:'期限：'+(t.deadline.indexOf('-')===-1?t.deadline:jd(t.deadline))+(est?'（目安）':''), estimated:est, recommend:t.recommend||'', done:done, state:key, stateLabel:stateLabel, bg:bg, fg:fg, who:who, whoBg:whoBg, whoFg:whoFg, isStaff:isStaff,
      labelColor: done?'#7B8694':'#2A3340', labelDecoration: done?'line-through':'none' };
  });
}

/* who must act on a document, matching the ToDo tab wording */

    var navW = (MODES[mode]||MODES.mobile).width;
    h += '<div style="display:flex;flex-direction:column;padding-bottom:88px;">';
    h += '<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #E7EBEF;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;"><div class="ms-logo" data-act="go" data-screen="home" role="button" tabindex="0" aria-label="ホームへ" title="ホームへ" style="display:flex;align-items:center;gap:10px;"><img src="logo.webp" alt="夢カナ留学" style="height:22px;width:auto;display:block;pointer-events:none;" /><span style="font-size:11px;letter-spacing:.1em;color:#7B8694;border-left:1px solid #E7EBEF;padding-left:10px;pointer-events:none;">会員サイト</span></div><div style="display:flex;align-items:center;gap:9px;"><button data-act="nav" data-screen="notices" aria-label="お知らせ"'+(unreadNotices()>0?' class="ms-bell"':'')+' style="position:relative;border:1px solid #E7EBEF;background:#fff;border-radius:100px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="'+(state.screen==='notices'?'#1F7A72':'#5B6672')+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+ICON_BELL+'"></path></svg>'+(unreadNotices()>0?'<span class="ms-bell-dot" style="position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:100px;background:#E0453A;color:#fff;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;">'+unreadNotices()+'</span>':'')+'</button><button data-act="toggleDev" style="border:1px dashed #C9D2D9;background:#F3F6F7;color:#7B8694;font-size:11px;font-weight:700;letter-spacing:.06em;padding:7px 11px;border-radius:100px;cursor:pointer;">DEV</button></div></header>';
    h += '<div style="padding:20px 18px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;"><div style="display:flex;flex-direction:column;gap:6px;min-width:0;"><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7B8694;">'+esc(t.en)+'</div><h1 style="margin:0;font-size:21px;font-weight:700;">'+esc(t.ja)+'</h1></div><div style="flex-shrink:0;">'+backBtn()+'</div></div>';
    h += screenContent();
    h += snsFooter();
    if(state.devOpen) h += renderDev();
    h += '<nav style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:'+navW+';background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid #E7EBEF;display:grid;grid-template-columns:repeat('+nav.length+',1fr);z-index:30;">';
    h += nav.map(function(n){var on=state.screen===n.key;var col=on?'#1F7A72':'#9AA6B2';return '<button data-act="nav" data-screen="'+n.key+'" style="border:none;background:none;cursor:pointer;padding:9px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+NAV_ICONS[n.key]+'"></path></svg><span style="font-size:11px;font-weight:'+(on?700:500)+';color:'+(on?'#2A3340':'#9AA6B2')+';white-space:nowrap;">'+esc(n.short||n.label)+'</span></button>';}).join('');
    h += '</nav>';
    h += '</div>';
  }
  h += renderChatbot();
  frame.innerHTML = h;
  if(lastScreen!==state.screen){
    lastScreen = state.screen;
    try{ window.scrollTo(0,0); document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(err){}
  }
}
var lastScreen = null;

/* ---------------- events ---------------- */
document.getElementById('frame').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el) return;
  var a = el.getAttribute('data-act');
  var prevScreen = state.screen;
  switch(a){
    case 'login': state.screen='home'; state.loginError=false; state.devOpen=false; state.cheer=pickCheer(); break;
    case 'toggleLoginError': state.loginError=!state.loginError; break;
    case 'back': state.devOpen=false; state.chatOpen=false; history.back(); return;
    case 'toggleDev': state.devOpen=!state.devOpen; break;
    case 'toggleChat': state.chatOpen=!state.chatOpen; break;
    case 'devBackdrop': if(e.target===el){ state.devOpen=false; } else { return; } break;
    case 'nav': state.screen=el.getAttribute('data-screen'); state.noticeId=null; break;
    case 'go':
      var scr=el.getAttribute('data-screen');
      state.screen=scr; state.devOpen=false;
      if(scr==='booking') state.bookingStep=1;
      if(scr==='notices') state.noticeId=null;
      break;
    case 'todoGo': { var tid=el.getAttribute('data-id'); state.devOpen=false;
      if(tid.indexOf('doc-')===0){ state.screen='docdetail'; state.docId=tid.slice(4); break; }
      var td=DATA.todos.filter(function(x){return x.id===tid;})[0]; if(td && td.target==='task'){ state.screen='task'; state.taskId=tid; } else { state.screen=(td&&td.target)||'todo'; } break; }
    case 'openNotice': { var nid=el.getAttribute('data-id'); var n=DATA.notices.filter(function(x){return x.id===nid;})[0]; if(n) n.unread=false; state.screen='notice'; state.noticeId=nid; state.devOpen=false; break; }
    case 'uploadDoc': state.docOverride[el.getAttribute('data-id')]='reviewing'; break;
    case 'preview': state.undecidedPreview=el.getAttribute('data-val'); break;
    case 'selectSlot': state.slotId=el.getAttribute('data-id'); break;
    case 'step': state.bookingStep=Number(el.getAttribute('data-step')); break;
    case 'setCountry': state.country=el.getAttribute('data-code'); break;
    case 'setResCountry': state.resCountry=el.getAttribute('data-code')||''; break;
    case 'opt': state[el.getAttribute('data-key')]=el.getAttribute('data-value'); break;
    case 'toggleOri': state.oriDone=!state.oriDone; break;
    case 'openDoc': state.screen='docdetail'; state.docId=el.getAttribute('data-id'); state.devOpen=false; break;
    case 'toggleFields': state.showFields=!state.showFields; break;
    case 'logout': state.screen='login'; state.devOpen=false; break;
    default: return;
  }
  if(state.screen!==prevScreen) pushHist(); else replaceHist();
  render();
});

replaceHist();
render();
</script>
</body>
</html>
