<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会員サイト 機能一覧とフェーズ分け</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1b2430; --sub:#6b7686; --line:#e3e7ec;
  --p1:#0f8a6a; --p1bg:#e8f6f1; --p2:#1f6fb2; --p2bg:#e8f1f9; --p3:#8a6a1f; --p3bg:#f9f3e4;
  --full:#0f8a6a; --part:#c47f16; --legacy:#9a5bb8; --none:#aab2bd;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:14px;line-height:1.7}
header{background:#13202e;color:#fff;padding:18px 20px}
header h1{margin:0;font-size:18px;letter-spacing:.02em}
header .meta{font-size:12px;color:#9fb0c2;margin-top:4px}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 80px}
.tabs{display:flex;gap:6px;margin:16px 0}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--sub);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px;font-family:inherit}
.tabs button.on{background:#13202e;color:#fff;border-color:#13202e}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink)}
.bar button:hover{background:#eef1f4}
.bar .warn{color:#b03030;border-color:#f0cccc}
.dates{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.dates label{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:8px}
.dates input{border:0;border-bottom:1px dashed #c3ccd6;font-size:14px;color:var(--ink);font-family:inherit;padding:2px 4px;width:190px;background:transparent}
.dates input:focus{outline:0;border-bottom-color:#13202e;background:#fffbe6}

.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pcard h2{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.pcard.p1 h2{background:var(--p1bg);color:var(--p1)}
.pcard.p2 h2{background:var(--p2bg);color:var(--p2)}
.pcard.p3 h2{background:var(--p3bg);color:var(--p3)}
.pcard.tbd{margin-top:14px;border-style:dashed}
.pcard.tbd h2{background:#f0f2f5;color:#5a6472}
.pcard.tbd .body{column-count:3;column-gap:24px}
@media(max-width:900px){.pcard.tbd .body{column-count:1}}
.pcard h2 .d{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:2px}
.pcard .body{padding:10px 12px}
.grp{margin-bottom:10px}
.grp>.gt{font-size:11px;color:var(--sub);letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:5px}
.f{display:flex;gap:7px;align-items:flex-start;padding:3px 0}
.f .nm{flex:1}
.badge{font-size:10.5px;padding:1px 7px;border-radius:999px;white-space:nowrap;flex:none;margin-top:3px}
.b-full{background:#e8f6f1;color:var(--full)}
.b-part{background:#fdf3e0;color:var(--part)}
.b-legacy{background:#f4ecf9;color:var(--legacy)}
.empty{color:var(--sub);font-size:12px;padding:6px 0}

.full{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.full h2{margin:0 0 10px;font-size:15px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px}
@media(max-width:760px){.fgrid{grid-template-columns:1fr}}
.fgrid .gt{font-size:11px;color:var(--sub);letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:3px;margin:10px 0 5px}
.fgrid li{list-style:none;padding:2px 0}
.fgrid .ds{color:var(--sub);font-size:12px}
.fgrid ul{margin:0;padding:0}

table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;font-size:13px}
th{background:#eef1f4;font-size:11.5px;color:var(--sub);letter-spacing:.04em;position:sticky;top:0;z-index:2}
td [contenteditable]{min-height:20px;outline:0;border-radius:3px;padding:1px 3px}
td [contenteditable]:focus{background:#fffbe6;box-shadow:0 0 0 1px #e0cc7a}
select{font-family:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);width:100%}
select.s-full{color:var(--full)}select.s-part{color:var(--part)}select.s-legacy{color:var(--legacy)}select.s-none{color:var(--none)}
.del{border:0;background:transparent;color:#c08;cursor:pointer;font-size:15px;line-height:1}
.hint{font-size:12px;color:var(--sub);margin:10px 0 14px}
dialog{border:0;border-radius:10px;padding:0;max-width:780px;width:92%}
dialog .dh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
dialog textarea{width:100%;height:58vh;border:0;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;resize:none;outline:0}
.saved{font-size:12px;color:var(--p1)}
@media print{header,.tabs,.bar,.hint{display:none}body{background:#fff}.cols{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</div>

<dialog id="dlg">

  <textarea id="out" readonly></textarea>
</dialog>

['運営・品質','不具合管理サイト','対応済／未対応のタブ管理・報告者へのお礼と修正完了連絡・修正履歴アーカイブ','一部のみ','完成系','','留学バトンの仕様を参考'],

['運営・品質','利用規約・プライバシーポリシー・免責事項','サイト障害時の免責範囲・問い合わせ窓口・情報の正確性の責任範囲等','完成系','','','桶谷先生のリーガルチェックを経て確定'],
['運営・品質','障害時対応フロー','検知から原因究明・復旧・お客様への連絡までの手順','完成系','','','担当：ヤン／副担当：マット'],
['運営・品質','チャットボット','よくある質問への自動応答','','','完成系',''],
['外部導線','LINEボタンの変更','公式LINEのボタンから会員サイトへ誘導','完成系','','','2026年10月中'],
['外部導線','Googleカレンダー連携','手続きの予定をお客様のGoogleカレンダーに自動追加する','','','完成系','最終マッピングに項目がないためPhase 3。Googleカレンダー未使用のお客様への対応も課題']
  ]
};

var S=load();
function load(){try{var v=localStorage.getItem(KEY);if(v)return JSON.parse(v);}catch(e){}return clone(DEFAULTS);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));flash();}catch(e){}}
var ft;
function flash(){var el=document.getElementById('saved');el.textContent=' 保存しました';clearTimeout(ft);ft=setTimeout(function(){el.textContent='';},1200);}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cls(v){return v==='完成系'?'s-full':v==='一部のみ'?'s-part':v==='旧運用を並走'?'s-legacy':'s-none';}
function bcls(v){return v==='完成系'?'b-full':v==='一部のみ'?'b-part':'b-legacy';}
function areas(){var a=[],seen={};S.rows.forEach(function(r){if(!seen[r[0]]){seen[r[0]]=1;a.push(r[0]);}});return a;}

function renderDates(){
  ['d1','d2','d3'].forEach(function(k){var el=document.getElementById(k);el.value=S[k];
    el.oninput=function(){S[k]=el.value;save();renderView();};});
}

function renderView(){
  // 完成系
  var h='';
  areas().forEach(function(a){
    h+='<div><div class="gt">'+esc(a)+'</div><ul>';
    S.rows.filter(function(r){return r[0]===a;}).forEach(function(r){
      h+='<li>− 機能：'+esc(r[1])+'<div class="ds">'+esc(r[2])+'</div></li>';
    });
    h+='</ul></div>';
  });
  document.getElementById('fullList').innerHTML=h;

  // フェーズ
  var ph='';
  [1,2,3].forEach(function(n){
    var rows=S.rows.filter(function(r){return r[2+n];});
    ph+='<div class="pcard p'+n+'"><h2>Phase '+n+'<span class="d">'+esc(S['d'+n])+'</span></h2><div class="body">';
    if(!rows.length){ph+='<div class="empty">該当なし</div>';}
    areas().forEach(function(a){
      var rs=rows.filter(function(r){return r[0]===a;});
      if(!rs.length)return;
      ph+='<div class="grp"><div class="gt">'+esc(a)+'</div>';
      rs.forEach(function(r){
        ph+='<div class="f"><span class="nm">− '+esc(r[1])+'</span><span class="badge '+bcls(r[2+n])+'">'+esc(r[2+n])+'</span></div>';
      });
      ph+='</div>';
    });
    ph+='</div></div>';
  });
  document.getElementById('phaseCols').innerHTML=ph;

  // フェーズ未定
  var tbd=S.rows.filter(function(r){return !r[3]&&!r[4]&&!r[5];});
  var t='';
  if(tbd.length){
    t='<div class="pcard tbd"><h2>フェーズ未定（'+tbd.length+'件）<span class="d">要件としては決定。どのフェーズで出すかは未決定</span></h2><div class="body">';
    areas().forEach(function(a){
      var rs=tbd.filter(function(r){return r[0]===a;});
      if(!rs.length)return;
      t+='<div class="grp"><div class="gt">'+esc(a)+'</div>';
      rs.forEach(function(r){t+='<div class="f"><span class="nm">− '+esc(r[1])+'</span></div>';});
      t+='</div>';
    });
    t+='</div></div>';
  }
  document.getElementById('tbdWrap').innerHTML=t;
}

function renderEdit(){
  var b=document.getElementById('tbody');b.innerHTML='';
  S.rows.forEach(function(r,i){
    var tr=document.createElement('tr');
    tr.innerHTML='<td><div contenteditable data-i="'+i+'" data-c="0">'+esc(r[0])+'</div></td>'
      +'<td><div contenteditable data-i="'+i+'" data-c="1">'+esc(r[1])+'</div></td>'
      +'<td><div contenteditable data-i="'+i+'" data-c="2">'+esc(r[2])+'</div></td>'
      +[3,4,5].map(function(c){
         return '<td><select data-i="'+i+'" data-c="'+c+'" class="'+cls(r[c])+'">'+STATES.map(function(s){
           return '<option value="'+esc(s)+'"'+(s===r[c]?' selected':'')+'>'+(s||'—')+'</option>';}).join('')+'</select></td>';
       }).join('')
      +'<td><div contenteditable data-i="'+i+'" data-c="6">'+esc(r[6]||'')+'</div></td>'
      +'<td><button class="del" data-i="'+i+'" title="削除">×</button></td>';
    b.appendChild(tr);
  });
}

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('contenteditable')&&t.dataset.i!==undefined){
    S.rows[+t.dataset.i][+t.dataset.c]=t.textContent;save();renderView();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.tagName==='SELECT'&&t.dataset.i!==undefined){
    S.rows[+t.dataset.i][+t.dataset.c]=t.value;t.className=cls(t.value);save();renderView();
  }
});
document.addEventListener('click',function(e){
  if(e.target.classList.contains('del')){
    var i=+e.target.dataset.i;
    if(confirm('「'+S.rows[i][1]+'」を削除しますか？')){S.rows.splice(i,1);save();renderEdit();renderView();}
  }
});

document.getElementById('btn-add').onclick=function(){
  S.rows.push(['（領域）','（新しい機能）','','','','','']);save();
  showTab('edit');renderEdit();renderView();
  var ds=document.querySelectorAll('#tbody [contenteditable][data-c="1"]');
  var last=ds[ds.length-1];last.focus();window.scrollTo(0,document.body.scrollHeight);
};
document.getElementById('btn-reset').onclick=function(){
  if(confirm('すべての編集内容を破棄して初期状態に戻しますか？')){S=clone(DEFAULTS);save();renderDates();renderEdit();renderView();}
};
document.getElementById('btn-print').onclick=function(){window.print();};

function textOut(){
  var o='・会員サイトの完成系\n';
  areas().forEach(function(a){
    o+='\n　【'+a+'】\n';
    S.rows.filter(function(r){return r[0]===a;}).forEach(function(r){o+='　−機能：'+r[1]+'\n';});
  });
  [1,2,3].forEach(function(n){
    o+='\n\nphase:'+n+'\n'+S['d'+n]+'\n';
    var rows=S.rows.filter(function(r){return r[2+n];});
    if(!rows.length){o+='　（該当なし）\n';return;}
    rows.forEach(function(r){o+='　−機能：'+r[1]+'\n　　−'+r[2+n]+'\n';});
  });
  var tbd=S.rows.filter(function(r){return !r[3]&&!r[4]&&!r[5];});
  if(tbd.length){
    o+='\n\nフェーズ未定（'+tbd.length+'件）\n要件としては決定。どのフェーズで出すかは未決定\n';
    tbd.forEach(function(r){o+='　−機能：'+r[1]+'\n';});
  }
  return o;
}
document.getElementById('btn-text').onclick=function(){
  document.getElementById('out').value=textOut();document.getElementById('dlg').showModal();
};
document.getElementById('btn-close').onclick=function(){document.getElementById('dlg').close();};
document.getElementById('btn-copy').onclick=function(){
  var t=document.getElementById('out');t.select();
  try{document.execCommand('copy');this.textContent='コピーしました';var b=this;setTimeout(function(){b.textContent='コピー';},1200);}catch(e){}
};

function showTab(w){
  document.getElementById('view').hidden=(w!=='view');
  document.getElementById('edit').hidden=(w!=='edit');
  document.getElementById('tab-view').className=(w==='view'?'on':'');
  document.getElementById('tab-edit').className=(w==='edit'?'on':'');
}
document.getElementById('tab-view').onclick=function(){showTab('view');};
document.getElementById('tab-edit').onclick=function(){showTab('edit');renderEdit();};

renderDates();renderView();renderEdit();
</script>
</body>
</html>
